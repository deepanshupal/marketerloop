[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "marketerloop"
version = "0.1.0"
description = "Open, marketer-in-the-loop agentic workflows. Templates as folders, BYOK, human approval on every word."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Deepanshu Pal"}]
dependencies = [
    "litellm>=1.40",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
marketerloop = "marketerloop.cli:main"

[tool.setuptools.packages.find]
include = ["marketerloop*"]

[tool.setuptools.package-data]
marketerloop = ["templates/**/*"]

[tool.pytest.ini_options]
# Each folder under workflows/ is its own package with its own tests and CI job.
testpaths = ["tests"]
